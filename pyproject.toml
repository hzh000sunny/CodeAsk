[project]
name = "codeask"
version = "0.1.0"
description = "Private-deployment R&D Q&A system"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "cryptography>=43",
    "structlog>=24.4",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "apscheduler>=3.10",
    "litellm>=1.50",
    "tiktoken>=0.7",
    "jsonschema>=4.23",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[project.scripts]
codeask = "codeask.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeask"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "ruff>=0.7",
    "pyright>=1.1.385",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --basetemp=.tmp/pytest"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
strict = ["src/codeask"]
# native_backend 是 v1.0.4 自研 Agent 的冻结参考代码（M3 隔离搬入），不在请求链路、
# 不随主链路演进维护，靠 tests/unit/test_native_backend_importable.py 运行时冒烟防 bitrot。
# 其历史 strict 类型债不应 gate CI；从 pyright 分析中排除（复活时再清，RAG 接 OpenViking）。
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "src/codeask/agent/native_backend",
]
